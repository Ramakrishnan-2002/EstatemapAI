services:
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: estatemap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estatemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estatemap_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-estatemap_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estatemap} -d ${POSTGRES_DB:-estatemap_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - estatemap-net

  redis:
    image: redis:7-alpine
    container_name: estatemap-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - estatemap-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estatemap-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-estatemap}:${POSTGRES_PASSWORD:-estatemap_dev_password}@postgres-postgis:5432/${POSTGRES_DB:-estatemap_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-insecure_dev_jwt_secret_key_change_in_production_min_32_bytes_long}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-3.6-flash
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres-postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - estatemap-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estatemap-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_MAP_DEFAULT_LAT: ${NEXT_PUBLIC_MAP_DEFAULT_LAT:-12.9716}
      NEXT_PUBLIC_MAP_DEFAULT_LNG: ${NEXT_PUBLIC_MAP_DEFAULT_LNG:-80.2458}
      NEXT_PUBLIC_MAP_DEFAULT_ZOOM: ${NEXT_PUBLIC_MAP_DEFAULT_ZOOM:-12}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - estatemap-net

volumes:
  postgres_data:
    name: estatemap_postgres_data
  redis_data:
    name: estatemap_redis_data

networks:
  estatemap-net:
    name: estatemap-network
    driver: bridge
